auth:
  existingSecret: mysql-root-secret
  database: wordpress
  username: wpuser

primary:
  persistence:
    enabled: true
    storageClass: "ebs-gp3"
    size: 5Gi

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

image:
  registry: docker.io
  repository: bitnamilegacy/mysql
  tag: 9.4.0-debian-12-r1

global:
  security:
    allowInsecureImages: true
