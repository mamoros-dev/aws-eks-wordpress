externalDatabase:
  host: mysql.wordpress.svc.cluster.local
  port: 3306
  user: wpuser
  database: wordpress
  existingSecret: wordpress-db-secret

mariadb:
  enabled: false

persistence:
  enabled: true
  storageClass: "ebs-gp3"
  size: 2Gi

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

service:
  type: ClusterIP
