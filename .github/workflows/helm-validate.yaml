name: Helm Validate

on:
  pull_request:
    paths:
      - 'helm/**'
      - 'k8s/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: 'latest'

      - name: Helm repo setup
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Pull charts locally
        run: |
          helm pull bitnami/mysql --untar --untardir /tmp/charts
          helm pull bitnami/wordpress --untar --untardir /tmp/charts

      - name: Lint MySQL values
        run: helm lint /tmp/charts/mysql --values helm/mysql-values.yaml

      - name: Lint WordPress values
        run: helm lint /tmp/charts/wordpress --values helm/wordpress-values.yaml