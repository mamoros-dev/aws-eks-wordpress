name: Helm Apply

on:
  push:
    branches: [main]
    paths:
      - 'helm/**'

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::700213287974:role/proyecto5-github-actions-eks-role
          aws-region: eu-west-1

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name proyecto5-wordpress --region eu-west-1

      - uses: azure/setup-helm@v4

      - name: Helm repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Upgrade MySQL
        run: helm upgrade mysql bitnami/mysql -n wordpress --values helm/mysql-values.yaml

      - name: Upgrade WordPress
        run: |
          helm upgrade wordpress bitnami/wordpress -n wordpress --values helm/wordpress-values.yaml \
            --set image.repository=bitnamilegacy/wordpress \
            --set image.tag=latest \
            --set global.security.allowInsecureImages=true
